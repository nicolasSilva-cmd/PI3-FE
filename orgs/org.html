<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Organizações</title>
  <link rel="stylesheet" href="./org.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="container">
    <h1>Cadastro de Organização</h1>
    <form id="orgForm" onsubmit="cadastrarOrg(event)">
      <input type="text" id="nome" placeholder="Nome" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="agenda" placeholder="Agenda" required />
      <input type="number" id="vagasDisponiveis" placeholder="Vagas Disponíveis" required />
      <input type="number" id="vagasReservadas" placeholder="Vagas Reservadas" required />
      <button type="submit">Cadastrar</button>
    </form>

    <h2>Buscar Organização</h2>
    <input type="text" id="buscarNome" placeholder="Digite o nome para buscar" />
    <button onclick="buscarPorNome()">Buscar</button>

    <h2>Organizações</h2>
    <div id="orgList" class="org-list"></div>
  </div>

  <script src="./org.js"></script>
</body>
</html>
